<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinanzaPro AI - Gestión Multi-Usuario</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    boxShadow: {
                        'premium': '0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04)',
                        'soft': '0 4px 6px -1px rgba(0, 0, 0, 0.05)',
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; scroll-behavior: smooth; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: rgba(99, 102, 241, 0.2); border-radius: 20px; }
        .hover-lift { transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .hover-lift:hover { transform: translateY(-5px); }
        .fade-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .scale-in { animation: scaleIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
        @keyframes scaleIn { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }
        /* Corregir visibilidad de opciones en el select */
        option { background-color: white; color: #1e293b; }
        .dark option { background-color: #1e293b; color: white; }
        /* Typing dots */
        .typing-dot { animation: typingBounce 1.2s ease-in-out infinite; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typingBounce { 0%, 80%, 100% { transform: translateY(0); opacity: 0.4; } 40% { transform: translateY(-5px); opacity: 1; } }
    </style>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 transition-colors duration-500 text-slate-800 dark:text-slate-200">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- GROQ API ---
        const GROQ_API_KEY = "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";

        const askGroq = async (messages) => {
            const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${GROQ_API_KEY}`
                },
                body: JSON.stringify({
                    model: "llama3-8b-8192",
                    messages,
                    max_tokens: 512,
                    temperature: 0.7
                })
            });
            if (!response.ok) throw new Error("Error API Groq: " + response.status);
            const data = await response.json();
            return data.choices[0].message.content;
        };

        // --- ICONOS ---
        const Icon = ({ name, className = "w-5 h-5" }) => {
            const icons = {
                wallet:      <path d="M21 12V7H5a2 2 0 0 1 0-4h14v4" />,
                plus:        <path d="M12 5v14M5 12h14" />,
                trash:       <path d="M3 6h18m-2 0v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6m3 0V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" />,
                edit:        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />,
                up:          <React.Fragment><polyline points="23 6 13.5 15.5 8.5 10.5 1 18" /><polyline points="17 6 23 6 23 12" /></React.Fragment>,
                down:        <React.Fragment><polyline points="23 18 13.5 8.5 8.5 13.5 1 6" /><polyline points="17 18 23 18 23 12" /></React.Fragment>,
                chart:       <path d="M21.21 15.89A10 10 0 1 1 8 2.83M22 12A10 10 0 0 0 12 2v10z" />,
                user:        <React.Fragment><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" /></React.Fragment>,
                brain:       <React.Fragment><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96-.46 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3Z"/><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96-.46 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3Z"/></React.Fragment>,
                sun:         <React.Fragment><circle cx="12" cy="12" r="5" /><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" /></React.Fragment>,
                moon:        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />,
                x:           <path d="M18 6L6 18M6 6l12 12" />,
                send:        <path d="m22 2-7 20-4-9-9-4Z" />,
                check:       <path d="M20 6L9 17l-5-5" />,
                pencil:      <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z" />,
                calculator:  <React.Fragment><rect x="4" y="2" width="16" height="20" rx="2" /><line x1="8" y1="6" x2="16" y2="6" /><line x1="16" y1="10" x2="16" y2="14" /><line x1="8" y1="10" x2="8" y2="10" /><line x1="12" y1="10" x2="12" y2="10" /><line x1="8" y1="14" x2="8" y2="14" /><line x1="12" y1="14" x2="12" y2="14" /><line x1="8" y1="18" x2="12" y2="18" /></React.Fragment>,
                trendUp:     <React.Fragment><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></React.Fragment>,
                list:        <React.Fragment><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></React.Fragment>,
                pieChart:    <React.Fragment><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></React.Fragment>,
                barChart:    <React.Fragment><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/><line x1="2" y1="20" x2="22" y2="20"/></React.Fragment>,
                sparkles:    <React.Fragment><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/></React.Fragment>,
            };
            return (
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name] || null}
                </svg>
            );
        };

        const Card = ({ children, className = "", noPadding = false }) => (
            <div className={`bg-white dark:bg-slate-900 rounded-[2.2rem] shadow-soft border border-slate-100 dark:border-white/5 transition-all duration-300 ${noPadding ? '' : 'p-6'} ${className}`}>
                {children}
            </div>
        );

        // --- COMPONENTES GRÁFICOS ---
        const SVGPieChart = ({ data }) => {
            const total = data.reduce((acc, item) => acc + item.value, 0);
            let currentAngle = 0;
            const colors = ['#6366f1', '#ec4899', '#10b981', '#f59e0b', '#06b6d4'];
            if (!total) return <div className="h-40 flex items-center justify-center text-slate-400 text-xs italic">Sin datos</div>;
            return (
                <div className="relative w-36 h-36 mx-auto group">
                    <svg viewBox="0 0 100 100" className="transform -rotate-90 w-full h-full overflow-visible transition-transform duration-700 group-hover:scale-105">
                        {data.map((item, index) => {
                            const percentage = item.value / total;
                            const dashArray = percentage * 314;
                            const color = colors[index % colors.length];
                            const circle = (
                                <circle key={item.name} r="25" cx="50" cy="50" fill="transparent"
                                    stroke={color} strokeWidth="50"
                                    strokeDasharray={`${dashArray} 314`}
                                    style={{ transformOrigin: '50px 50px', transform: `rotate(${currentAngle}rad)`, transition: 'all 0.6s' }}>
                                    <title>{item.name}: ${item.value.toLocaleString()}</title>
                                </circle>
                            );
                            currentAngle += percentage * 2 * Math.PI;
                            return circle;
                        })}
                        <circle cx="50" cy="50" r="28" className="fill-white dark:fill-slate-900" />
                    </svg>
                    <div className="absolute inset-0 flex flex-col items-center justify-center pointer-events-none text-center">
                        <span className="text-[8px] uppercase font-bold text-slate-400">Total</span>
                        <span className="text-xs font-black text-slate-900 dark:text-white">${total.toLocaleString()}</span>
                    </div>
                </div>
            );
        };

        const SVGBarChart = ({ income, expense }) => {
            const max = Math.max(income, expense, 100);
            return (
                <div className="h-40 flex items-end justify-center gap-6 px-4">
                    {[
                        { label: 'In', val: income, col: 'bg-emerald-500' },
                        { label: 'Out', val: expense, col: 'bg-rose-500' }
                    ].map((item, i) => (
                        <div key={i} className="flex-1 flex flex-col items-center group h-full justify-end">
                            <div className="mb-1 opacity-0 group-hover:opacity-100 transition-all text-[8px] font-bold bg-slate-800 text-white px-1.5 py-0.5 rounded shadow-lg">
                                ${item.val.toLocaleString()}
                            </div>
                            <div className={`${item.col} w-full rounded-xl shadow-lg transition-all duration-1000`}
                                style={{ height: `${(item.val / max) * 100}%`, minHeight: '8px' }}>
                            </div>
                            <span className="mt-2 text-[10px] font-bold text-slate-500">{item.label}</span>
                        </div>
                    ))}
                </div>
            );
        };

        const DescriptionBarChart = ({ transactions }) => {
            const stats = useMemo(() => {
                const grouped = transactions.filter(t => t.type === 'expense').reduce((acc, t) => {
                    const desc = (t.description || 'Sin descripción').trim().toLowerCase();
                    acc[desc] = (acc[desc] || 0) + t.amount;
                    return acc;
                }, {});
                return Object.entries(grouped).sort((a, b) => b[1] - a[1]);
            }, [transactions]);
            const max = Math.max(...stats.map(s => s[1]), 1);
            return (
                <div className="w-full max-h-[160px] overflow-y-auto custom-scrollbar space-y-3 pr-1">
                    {stats.length === 0
                        ? <div className="h-32 flex items-center justify-center text-slate-400 text-xs">Sin gastos</div>
                        : stats.map(([desc, amount], i) => (
                            <div key={i} className="space-y-1 fade-in">
                                <div className="flex justify-between items-center text-[9px] font-bold uppercase tracking-wider">
                                    <span className="truncate w-24 text-slate-500">{desc}</span>
                                    <span className="text-slate-900 dark:text-white">${amount.toLocaleString()}</span>
                                </div>
                                <div className="h-1.5 w-full bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden">
                                    <div className="h-full bg-indigo-500 transition-all duration-1000" style={{ width: (amount / max) * 100 + "%" }}></div>
                                </div>
                            </div>
                        ))
                    }
                </div>
            );
        };

        // --- ASISTENTE IA CON GROQ ---
        const AISidebar = ({ transactions }) => {
            const [messages, setMessages] = useState([]);
            const [input, setInput] = useState('');
            const [isLoading, setIsLoading] = useState(false);
            const scrollRef = useRef(null);

            useEffect(() => {
                scrollRef.current?.scrollIntoView({ behavior: "smooth" });
            }, [messages, isLoading]);

            const buildSystemPrompt = () => {
                const expenses = transactions.filter(t => t.type === 'expense');
                const totalIncome = transactions.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
                const totalExpense = expenses.reduce((s, t) => s + t.amount, 0);
                const balance = totalIncome - totalExpense;
                const topExpenses = expenses
                    .reduce((acc, t) => { acc[t.description] = (acc[t.description] || 0) + t.amount; return acc; }, {});
                const topList = Object.entries(topExpenses).sort((a, b) => b[1] - a[1]).slice(0, 5)
                    .map(([k, v]) => `${k}: $${v}`).join(', ');

                return `Eres FinanzaPro AI, un asistente financiero personal experto y amigable. Hablas en español, eres conciso y directo.
Datos financieros actuales del usuario:
- Ingresos totales: $${totalIncome.toLocaleString()}
- Gastos totales: $${totalExpense.toLocaleString()}
- Balance: $${balance.toLocaleString()}
- Principales gastos: ${topList || 'Sin datos aún'}
Número de transacciones: ${transactions.length}
Responde siempre en español. Sé útil, empático y da consejos prácticos basados en sus datos reales. Máximo 3 oraciones por respuesta.`;
            };

            const handleSend = async () => {
                const userText = input.trim() || "Dame un consejo financiero basado en mis datos";
                if (isLoading) return;

                const newMessages = [...messages, { role: 'user', text: userText }];
                setMessages(newMessages);
                setInput('');
                setIsLoading(true);

                try {
                    const apiMessages = [
                        { role: 'system', content: buildSystemPrompt() },
                        ...newMessages.map(m => ({ role: m.role === 'ai' ? 'assistant' : 'user', content: m.text }))
                    ];
                    const reply = await askGroq(apiMessages);
                    setMessages(prev => [...prev, { role: 'ai', text: reply }]);
                } catch (err) {
                    setMessages(prev => [...prev, { role: 'ai', text: '⚠️ Error al conectar con la IA. Verifica tu conexión.' }]);
                } finally {
                    setIsLoading(false);
                }
            };

            return (
                <Card className="h-full flex flex-col overflow-hidden bg-slate-900 border-none shadow-premium relative" noPadding>
                    {/* Header */}
                    <div className="p-4 border-b border-white/10 flex items-center gap-3 bg-white/5 backdrop-blur-xl relative overflow-hidden">
                        <div className="absolute inset-0 opacity-5 pointer-events-none flex items-center justify-end pr-4">
                            <Icon name="brain" className="w-20 h-20 text-indigo-300" />
                        </div>
                        <div className="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center shadow-lg shadow-indigo-600/40 animate-pulse">
                            <Icon name="brain" className="text-white w-5 h-5" />
                        </div>
                        <div>
                            <h3 className="font-bold text-white text-sm">Analista IA</h3>
                            <span className="text-[9px] text-emerald-400 font-bold uppercase tracking-widest leading-none">Groq · LLaMA3</span>
                        </div>
                    </div>

                    {/* Messages */}
                    <div className="flex-1 overflow-y-auto p-4 space-y-4 custom-scrollbar bg-slate-900/40">
                        {messages.length === 0 ? (
                            <div className="h-full flex flex-col items-center justify-center text-center opacity-30 px-4 space-y-3">
                                <Icon name="sparkles" className="w-10 h-10 text-indigo-400" />
                                <p className="text-[10px] text-slate-300">
                                    ¿Quieres un consejo sobre ahorros o gastos? Analizo tus datos reales al instante con IA de Groq.
                                </p>
                            </div>
                        ) : messages.map((m, i) => (
                            <div key={i} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'} fade-in`}>
                                <div className={`max-w-[85%] rounded-2xl p-3 text-[11px] leading-relaxed ${m.role === 'user'
                                    ? 'bg-indigo-600 text-white rounded-tr-none'
                                    : 'bg-slate-800 text-slate-200 border border-white/5 rounded-tl-none'}`}>
                                    {m.text}
                                </div>
                            </div>
                        ))}

                        {isLoading && (
                            <div className="flex justify-start fade-in">
                                <div className="bg-slate-800 border border-white/5 rounded-2xl rounded-tl-none p-3 flex items-center gap-1.5">
                                    <span className="typing-dot w-1.5 h-1.5 rounded-full bg-indigo-400 inline-block"></span>
                                    <span className="typing-dot w-1.5 h-1.5 rounded-full bg-indigo-400 inline-block"></span>
                                    <span className="typing-dot w-1.5 h-1.5 rounded-full bg-indigo-400 inline-block"></span>
                                </div>
                            </div>
                        )}
                        <div ref={scrollRef} />
                    </div>

                    {/* Input */}
                    <div className="p-3 bg-white/5 border-t border-white/10 flex gap-2">
                        <input
                            value={input}
                            onChange={e => setInput(e.target.value)}
                            onKeyDown={e => e.key === 'Enter' && handleSend()}
                            placeholder="Pregunta algo sobre tus finanzas..."
                            disabled={isLoading}
                            className="flex-1 bg-black/20 border border-white/10 rounded-xl px-3 py-2 text-xs text-white outline-none focus:ring-1 focus:ring-indigo-500 placeholder-white/30 disabled:opacity-50 transition-all"
                        />
                        <button
                            onClick={handleSend}
                            disabled={isLoading}
                            className="p-2 bg-indigo-600 text-white rounded-xl active:scale-90 transition-transform disabled:opacity-50 hover:bg-indigo-500">
                            <Icon name="send" className="w-4 h-4" />
                        </button>
                    </div>
                </Card>
            );
        };

        // --- COMPONENTE PRINCIPAL ---
        function App() {
            const [users, setUsers] = useState(() => JSON.parse(localStorage.getItem('fp_users')) || ['Personal']);
            const [currentUser, setCurrentUser] = useState(() => localStorage.getItem('fp_current_user') || 'Personal');
            const [darkMode, setDarkMode] = useState(false);
            const [transactions, setTransactions] = useState([]);
            const [categories, setCategories] = useState([]);
            const [userModal, setUserModal] = useState({ isOpen: false, type: 'add', value: '' });
            const [modalOpen, setModalOpen] = useState(false);
            const [editingTransaction, setEditingTransaction] = useState(null);

            useEffect(() => {
                const userKey = currentUser.replace(/\s/g, '_');
                const savedData = JSON.parse(localStorage.getItem('fp_data_' + userKey)) || [];
                const savedCats = JSON.parse(localStorage.getItem('fp_cats_' + userKey)) || ['Comida', 'Salario', 'Hogar', 'Transporte', 'Salud', 'Ocio'];
                const savedDark = JSON.parse(localStorage.getItem('fp_dark_' + userKey)) ?? false;
                setTransactions(savedData);
                setCategories(savedCats);
                setDarkMode(savedDark);
                localStorage.setItem('fp_current_user', currentUser);
            }, [currentUser]);

            useEffect(() => {
                const userKey = currentUser.replace(/\s/g, '_');
                localStorage.setItem('fp_data_' + userKey, JSON.stringify(transactions));
                localStorage.setItem('fp_cats_' + userKey, JSON.stringify(categories));
                localStorage.setItem('fp_dark_' + userKey, JSON.stringify(darkMode));
                localStorage.setItem('fp_users', JSON.stringify(users));
                document.documentElement.classList.toggle('dark', darkMode);
            }, [transactions, categories, darkMode, users, currentUser]);

            const stats = useMemo(() => {
                const inc = transactions.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
                const exp = transactions.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
                const byCat = transactions.filter(t => t.type === 'expense').reduce((acc, t) => {
                    const name = (t.category || 'General').trim();
                    acc[name] = (acc[name] || 0) + t.amount;
                    return acc;
                }, {});
                return { inc, exp, bal: inc - exp, cData: Object.entries(byCat).map(([name, value]) => ({ name, value })) };
            }, [transactions]);

            const handleSaveTransaction = (t) => {
                if (t.id) setTransactions(prev => prev.map(x => x.id === t.id ? t : x));
                else setTransactions(prev => [{ ...t, id: Date.now() }, ...prev]);
                setModalOpen(false);
                setEditingTransaction(null);
            };

            const handleAddOrEditUser = () => {
                const newName = userModal.value.trim();
                if (!newName || (userModal.type === 'add' && users.includes(newName))) return;
                if (userModal.type === 'add') {
                    setUsers(prev => [...prev, newName]);
                    setCurrentUser(newName);
                } else {
                    const oldKey = currentUser.replace(/\s/g, '_');
                    const newKey = newName.replace(/\s/g, '_');
                    localStorage.setItem('fp_data_' + newKey, localStorage.getItem('fp_data_' + oldKey));
                    localStorage.setItem('fp_cats_' + newKey, localStorage.getItem('fp_cats_' + oldKey));
                    localStorage.setItem('fp_dark_' + newKey, localStorage.getItem('fp_dark_' + oldKey));
                    localStorage.removeItem('fp_data_' + oldKey);
                    localStorage.removeItem('fp_cats_' + oldKey);
                    localStorage.removeItem('fp_dark_' + oldKey);
                    setUsers(prev => prev.map(u => u === currentUser ? newName : u));
                    setCurrentUser(newName);
                }
                setUserModal({ isOpen: false, type: 'add', value: '' });
            };

            return (
                <div className="min-h-screen bg-slate-50 dark:bg-slate-950 transition-colors duration-500 pb-20 text-slate-900 dark:text-white">

                    {/* NAVBAR */}
                    <nav className="h-16 bg-white/70 dark:bg-slate-900/70 backdrop-blur-2xl border-b border-slate-200 dark:border-white/5 sticky top-0 z-40 px-8 flex justify-between items-center">
                        <div className="flex items-center gap-3">
                            <div className="bg-indigo-600 p-2 rounded-xl text-white shadow-lg">
                                <Icon name="wallet" />
                            </div>
                            <span className="font-black text-xl tracking-tighter">Finanza<span className="text-indigo-600">Pro</span></span>
                        </div>

                        <div className="flex items-center gap-4">
                            {/* Selector de usuario */}
                            <div className="flex items-center gap-2 bg-slate-100 dark:bg-slate-800 px-3 py-1.5 rounded-2xl border border-slate-200 dark:border-white/10">
                                <Icon name="user" className="w-4 h-4 text-indigo-500" />
                                <select
                                    value={currentUser}
                                    onChange={(e) => setCurrentUser(e.target.value)}
                                    className="bg-transparent text-xs font-bold outline-none cursor-pointer pr-1 dark:text-white"
                                >
                                    {users.map(u => <option key={u} value={u}>{u}</option>)}
                                </select>
                                <div className="flex items-center border-l border-slate-300 dark:border-slate-700 ml-1 pl-1 gap-1">
                                    <button
                                        onClick={() => setUserModal({ isOpen: true, type: 'edit', value: currentUser })}
                                        className="p-1 hover:bg-white dark:hover:bg-slate-700 rounded-lg text-indigo-500 transition-colors"
                                        title="Editar Nombre">
                                        <Icon name="pencil" className="w-3.5 h-3.5" />
                                    </button>
                                    <button
                                        onClick={() => setUserModal({ isOpen: true, type: 'add', value: '' })}
                                        className="p-1 hover:bg-white dark:hover:bg-slate-700 rounded-lg text-emerald-500 transition-colors"
                                        title="Nuevo Perfil">
                                        <Icon name="plus" className="w-3.5 h-3.5" />
                                    </button>
                                </div>
                            </div>

                            {/* Dark mode toggle */}
                            <button
                                onClick={() => setDarkMode(!darkMode)}
                                className="w-10 h-10 flex items-center justify-center rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-white/10 shadow-sm transition-transform active:scale-90">
                                {darkMode
                                    ? <Icon name="sun" className="text-amber-400" />
                                    : <Icon name="moon" className="text-indigo-600" />}
                            </button>
                        </div>
                    </nav>

                    <main className="max-w-[1600px] mx-auto px-8 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
                        <div className="lg:col-span-9 space-y-8">

                            {/* Header con botón más pequeño */}
                            <div className="flex justify-between items-end">
                                <div>
                                    <h1 className="text-4xl font-black tracking-tight">Panel de {currentUser}</h1>
                                    <p className="text-slate-500 text-sm mt-1">Los cambios se sincronizan automáticamente.</p>
                                </div>
                                <button
                                    onClick={() => { setEditingTransaction(null); setModalOpen(true); }}
                                    className="px-4 py-2.5 bg-indigo-600 text-white rounded-2xl font-bold text-sm hover-lift shadow-lg shadow-indigo-600/30 active:scale-95 transition-all flex items-center gap-1.5">
                                    <Icon name="plus" className="w-4 h-4" />
                                    <span>Nuevo Registro</span>
                                </button>
                            </div>

                            {/* Tarjetas de stats con icono semitransparente */}
                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-6">
                                <Card className="hover-lift border-b-4 border-emerald-500 flex flex-col justify-between relative overflow-hidden">
                                    <div className="absolute -right-3 -bottom-3 opacity-[0.06] pointer-events-none">
                                        <Icon name="up" className="w-24 h-24 text-emerald-600" />
                                    </div>
                                    <div className="flex justify-between items-start">
                                        <span className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Ingresos</span>
                                        <Icon name="up" className="w-5 h-5 text-emerald-500" />
                                    </div>
                                    <p className="text-2xl font-black text-emerald-600 mt-2">${stats.inc.toLocaleString()}</p>
                                </Card>
                                <Card className="hover-lift border-b-4 border-rose-500 flex flex-col justify-between relative overflow-hidden">
                                    <div className="absolute -right-3 -bottom-3 opacity-[0.06] pointer-events-none">
                                        <Icon name="down" className="w-24 h-24 text-rose-600" />
                                    </div>
                                    <div className="flex justify-between items-start">
                                        <span className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Gastos</span>
                                        <Icon name="down" className="w-5 h-5 text-rose-500" />
                                    </div>
                                    <p className="text-2xl font-black text-rose-600 mt-2">${stats.exp.toLocaleString()}</p>
                                </Card>
                                <Card className={`hover-lift border-0 bg-gradient-to-br ${stats.bal >= 0 ? 'from-indigo-600 to-violet-700' : 'from-rose-600 to-orange-600'} text-white shadow-2xl flex flex-col justify-between relative overflow-hidden`}>
                                    <div className="absolute -right-4 -bottom-4 opacity-10 pointer-events-none">
                                        <Icon name="wallet" className="w-28 h-28 text-white" />
                                    </div>
                                    <div className="flex justify-between items-start">
                                        <span className="text-[10px] font-bold opacity-70 uppercase tracking-widest">Balance</span>
                                        <Icon name={stats.bal >= 0 ? "up" : "down"} className="w-5 h-5 opacity-80" />
                                    </div>
                                    <p className="text-2xl font-black mt-2">${stats.bal.toLocaleString()}</p>
                                </Card>
                            </div>

                            {/* Gráficas con iconos semitransparentes */}
                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                <Card className="flex flex-col items-center justify-between min-h-[260px] relative overflow-hidden">
                                    <div className="absolute -right-4 -top-4 opacity-[0.04] pointer-events-none">
                                        <Icon name="pieChart" className="w-28 h-28 text-indigo-600" />
                                    </div>
                                    <h3 className="w-full font-bold text-[10px] uppercase tracking-widest text-slate-500 flex items-center gap-2">
                                        <Icon name="chart" className="w-3 h-3" /> Distribución
                                    </h3>
                                    <SVGPieChart data={stats.cData} />
                                </Card>
                                <Card className="flex flex-col justify-between min-h-[260px] relative overflow-hidden">
                                    <div className="absolute -right-4 -top-4 opacity-[0.04] pointer-events-none">
                                        <Icon name="barChart" className="w-28 h-28 text-indigo-600" />
                                    </div>
                                    <h3 className="font-bold text-[10px] uppercase tracking-widest text-slate-500 flex items-center gap-2">
                                        <Icon name="chart" className="w-3 h-3" /> Rendimiento
                                    </h3>
                                    <SVGBarChart income={stats.inc} expense={stats.exp} />
                                </Card>
                                <Card className="flex flex-col justify-between min-h-[260px] relative overflow-hidden">
                                    <div className="absolute -right-4 -top-4 opacity-[0.04] pointer-events-none">
                                        <Icon name="calculator" className="w-28 h-28 text-indigo-600" />
                                    </div>
                                    <h3 className="font-bold text-[10px] uppercase tracking-widest text-slate-500 flex items-center gap-2">
                                        <Icon name="calculator" className="w-3 h-3" /> Por Descripción
                                    </h3>
                                    <DescriptionBarChart transactions={transactions} />
                                </Card>
                            </div>

                            {/* Lista de movimientos */}
                            <Card noPadding className="overflow-hidden shadow-soft relative">
                                <div className="absolute right-0 top-0 h-full flex items-center pr-8 opacity-[0.03] pointer-events-none">
                                    <Icon name="list" className="w-40 h-40 text-indigo-600" />
                                </div>
                                <div className="p-6 border-b border-slate-100 dark:border-white/5 flex justify-between items-center bg-white/50 dark:bg-slate-900/50 backdrop-blur-xl">
                                    <h3 className="font-bold text-sm text-slate-900 dark:text-white flex items-center gap-2">
                                        <Icon name="edit" className="w-4 h-4 text-indigo-500" /> Movimientos Recientes
                                    </h3>
                                    {transactions.length > 0 &&
                                        <button onClick={() => setTransactions([])} className="text-[10px] font-bold text-rose-500 hover:underline">
                                            Limpiar Todo
                                        </button>}
                                </div>
                                <div className="divide-y divide-slate-100 dark:divide-white/5 max-h-[400px] overflow-y-auto custom-scrollbar">
                                    {transactions.length === 0
                                        ? <div className="p-20 text-center opacity-30 text-xs font-bold uppercase tracking-widest">Sin movimientos</div>
                                        : transactions.map((t) => (
                                            <div key={t.id} className="p-5 flex items-center justify-between hover:bg-slate-50 dark:hover:bg-slate-800/50 group transition-all fade-in">
                                                <div className="flex items-center gap-5">
                                                    <div className={`w-12 h-12 rounded-2xl flex items-center justify-center shadow-sm ${t.type === 'income' ? 'bg-emerald-50 text-emerald-600 dark:bg-emerald-500/10' : 'bg-rose-50 text-rose-600 dark:bg-rose-500/10'}`}>
                                                        <Icon name={t.type === 'income' ? 'up' : 'down'} className="w-6 h-6" />
                                                    </div>
                                                    <div>
                                                        <p className="font-bold text-xs capitalize text-slate-800 dark:text-slate-100 leading-tight">{t.description}</p>
                                                        <span className="text-[9px] font-black uppercase text-slate-400 tracking-wider">{t.category} · {t.date}</span>
                                                    </div>
                                                </div>
                                                <div className="flex items-center gap-6">
                                                    <span className={`text-sm font-black tabular-nums ${t.type === 'income' ? 'text-emerald-500' : 'text-slate-700 dark:text-slate-300'}`}>
                                                        {t.type === 'income' ? '+' : '-'}${t.amount.toLocaleString()}
                                                    </span>
                                                    <div className="flex gap-1 opacity-0 group-hover:opacity-100 transition-all">
                                                        <button
                                                            onClick={() => { setEditingTransaction(t); setModalOpen(true); }}
                                                            className="p-1.5 text-slate-400 hover:text-indigo-500 transition-colors">
                                                            <Icon name="edit" className="w-4 h-4" />
                                                        </button>
                                                        <button
                                                            onClick={() => setTransactions(prev => prev.filter(x => x.id !== t.id))}
                                                            className="p-1.5 text-slate-400 hover:text-rose-500 transition-colors">
                                                            <Icon name="trash" className="w-4 h-4" />
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                        ))
                                    }
                                </div>
                            </Card>
                        </div>

                        {/* Sidebar IA */}
                        <div className="lg:col-span-3 h-[calc(100vh-10rem)] sticky top-24">
                            <AISidebar transactions={transactions} />
                        </div>
                    </main>

                    {/* Modal usuario */}
                    {userModal.isOpen && (
                        <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-xl z-[100] flex items-center justify-center p-6 fade-in text-slate-900 dark:text-white">
                            <Card className="w-full max-w-sm p-8 relative scale-in shadow-premium border-none">
                                <h2 className="text-xl font-black mb-6 flex items-center gap-3">
                                    <Icon name="user" className="text-indigo-600" />
                                    {userModal.type === 'add' ? 'Nuevo Perfil' : 'Editar Nombre'}
                                </h2>
                                <input
                                    value={userModal.value}
                                    onChange={e => setUserModal({ ...userModal, value: e.target.value })}
                                    onKeyDown={e => e.key === 'Enter' && handleAddOrEditUser()}
                                    placeholder="Nombre del usuario..."
                                    className="w-full bg-slate-50 dark:bg-white/5 border border-slate-200 dark:border-white/10 rounded-2xl px-5 py-4 text-sm outline-none focus:ring-2 focus:ring-indigo-500 transition-all dark:text-white mb-6"
                                    autoFocus
                                />
                                <div className="flex gap-3">
                                    <button
                                        onClick={() => setUserModal({ ...userModal, isOpen: false })}
                                        className="flex-1 py-3 bg-slate-100 dark:bg-slate-800 rounded-2xl font-bold text-sm transition-colors hover:bg-slate-200 dark:hover:bg-slate-700">
                                        Cancelar
                                    </button>
                                    <button
                                        onClick={handleAddOrEditUser}
                                        className="flex-1 py-3 bg-indigo-600 text-white rounded-2xl font-bold text-sm shadow-lg shadow-indigo-600/30 hover:bg-indigo-500 transition-colors">
                                        Confirmar
                                    </button>
                                </div>
                            </Card>
                        </div>
                    )}

                    {/* Modal transacción */}
                    {modalOpen && (
                        <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-xl z-[100] flex items-center justify-center p-6 fade-in text-slate-900 dark:text-white">
                            <Card className="w-full max-w-lg p-10 relative scale-in shadow-premium border-none">
                                <button
                                    onClick={() => { setModalOpen(false); setEditingTransaction(null); }}
                                    className="absolute top-6 right-6 p-2 text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-2xl transition-colors">
                                    <Icon name="x" />
                                </button>
                                <h2 className="text-2xl font-black mb-8 flex items-center gap-4">
                                    <div className="p-3 bg-indigo-50 dark:bg-indigo-900/30 rounded-2xl">
                                        <Icon name={editingTransaction ? 'edit' : 'plus'} className="w-6 h-6 text-indigo-600" />
                                    </div>
                                    {editingTransaction ? 'Editar' : 'Añadir'} Registro
                                </h2>

                                <form onSubmit={(e) => {
                                    e.preventDefault();
                                    const d = new FormData(e.target);
                                    handleSaveTransaction({
                                        id: editingTransaction?.id,
                                        description: d.get('description'),
                                        amount: Number(d.get('amount')),
                                        type: d.get('type'),
                                        category: d.get('category'),
                                        date: d.get('date')
                                    });
                                }} className="space-y-6">
                                    <div className="bg-slate-100 dark:bg-slate-800 p-1.5 rounded-2xl flex gap-1 shadow-inner">
                                        {['income', 'expense'].map(tp => (
                                            <label key={tp} className="flex-1 text-center">
                                                <input
                                                    type="radio" name="type" value={tp}
                                                    defaultChecked={editingTransaction?.type === tp || (!editingTransaction && tp === 'expense')}
                                                    className="hidden peer"
                                                />
                                                <div className="cursor-pointer py-3 rounded-xl text-[10px] font-black uppercase transition-all peer-checked:bg-white dark:peer-checked:bg-slate-700 peer-checked:text-indigo-600 text-slate-500 peer-checked:shadow-sm">
                                                    {tp === 'income' ? 'Ingreso' : 'Gasto'}
                                                </div>
                                            </label>
                                        ))}
                                    </div>

                                    <div className="space-y-4">
                                        <div className="relative">
                                            <span className="absolute left-6 top-1/2 -translate-y-1/2 text-2xl font-black text-slate-300">$</span>
                                            <input
                                                name="amount" type="number" step="0.01" min="0.01" required
                                                defaultValue={editingTransaction?.amount}
                                                placeholder="0.00"
                                                className="w-full bg-slate-50 dark:bg-slate-900 border-2 border-transparent focus:border-indigo-500 rounded-3xl pl-12 pr-6 py-5 text-4xl font-black outline-none transition-all dark:text-white"
                                            />
                                        </div>
                                        <input
                                            name="description" required
                                            defaultValue={editingTransaction?.description}
                                            placeholder="Descripción (ej: Refresco)"
                                            className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-white/10 rounded-2xl px-6 py-4 outline-none focus:ring-1 focus:ring-indigo-500 text-sm dark:text-white transition-all"
                                        />
                                        <div className="grid grid-cols-2 gap-4">
                                            <div className="space-y-2 text-xs">
                                                <span className="font-bold text-slate-400 uppercase ml-1">Categoría</span>
                                                <select
                                                    name="category"
                                                    defaultValue={editingTransaction?.category || 'General'}
                                                    className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-white/10 rounded-xl px-3 py-3 outline-none dark:text-white appearance-none">
                                                    {categories.map(c => <option key={c} value={c}>{c}</option>)}
                                                </select>
                                            </div>
                                            <div className="space-y-2 text-xs">
                                                <span className="font-bold text-slate-400 uppercase ml-1">Fecha</span>
                                                <input
                                                    name="date" type="date" required
                                                    defaultValue={editingTransaction?.date || new Date().toISOString().split('T')[0]}
                                                    className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-white/10 rounded-xl px-3 py-3 outline-none dark:text-white"
                                                />
                                            </div>
                                        </div>
                                    </div>
                                    <button
                                        type="submit"
                                        className="w-full py-4 bg-indigo-600 text-white rounded-2xl font-bold text-xl mt-4 shadow-xl shadow-indigo-600/30 active:scale-95 transition-all hover:bg-indigo-500">
                                        Guardar Movimiento
                                    </button>
                                </form>
                            </Card>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
